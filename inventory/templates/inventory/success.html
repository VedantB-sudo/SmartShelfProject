<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | SmartShelf</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-card: rgba(255, 255, 255, 0.98);
            --success: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        .success-card { 
            background: var(--glass-card); 
            padding: 60px 40px; 
            border-radius: 32px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
            text-align: center; 
            max-width: 440px; 
            width: 90%;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Animated Checkmark Container */
        .checkmark-circle { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            background: #ecfdf5; 
            color: var(--success);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0 auto 30px; 
            position: relative;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .checkmark { 
            font-size: 50px; 
            animation: checkmarkGrow 0.5s ease-in-out forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes checkmarkGrow {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        h2 { 
            color: var(--text-main); 
            margin: 0 0 15px; 
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -1.5px;
        }

        p { 
            color: var(--text-muted); 
            margin-bottom: 40px; 
            line-height: 1.6;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .btn-home { 
            background: var(--primary); 
            color: white; 
            padding: 18px 36px; 
            text-decoration: none; 
            border-radius: 16px; 
            font-weight: 800; 
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .btn-home:hover { 
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.4);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="checkmark-circle">
            <i class="fas fa-check checkmark"></i>
        </div>
        <h2>Success!</h2>
        <p>Your product has been accurately logged and updated in the <strong>SmartShelf</strong> master database.</p>
        <a href="{% url 'dashboard' %}" class="btn-home">
            <i class="fas fa-arrow-left"></i> Return to Dashboard
        </a>
    </div>
</body>
</html>
