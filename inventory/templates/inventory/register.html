<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShelf | Staff Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .register-container {
            background: var(--glass-bg);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        form p {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-left: 4px;
        }

        input[type="text"], 
        input[type="password"], 
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Specialized Role Section */
        .role-section {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 16px;
            border-left: 4px solid var(--primary);
            margin: 1.5rem 0;
        }

        .role-section label {
            color: var(--primary);
            display: block;
            margin-bottom: 10px;
        }

        .helptext {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
            line-height: 1.4;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-register:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        /* Messages */
        .messages {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .message.success { background: #ecfdf5; color: var(--success); border-color: #d1fae5; }
        .message.error { background: #fef2f2; color: var(--error); border-color: #fee2e2; }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f1f5f9;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .footer a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="header">
            <h1>Create Account</h1>
            <p>Onboard SmartShelf Personnel</p>
        </div>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="message {{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}

            <div class="role-section">
                <label for="role">Assign Security Role</label>
                <select name="role" id="role" required>
                    <option value="staff">Staff (Standard Access)</option>
                    <option value="admin">Admin (Full Oversight)</option>
                </select>
                <span class="helptext">Admins can manage credentials and financial oversight.</span>
            </div>

            <button type="submit" class="btn-register">Complete Registration</button>
        </form>

        <div class="footer">
            <a href="{% url 'custom_admin' %}">← Return to Oversight Panel</a>
        </div>
    </div>

</body>
</html>
