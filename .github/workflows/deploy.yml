name: Deploy SmartShelf Ecosystem

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Django Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        run: |
          python manage.py test

  deploy-web:
    name: 🚀 Deploy SmartShelf to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_region: us-east-1

      - name: Create Environment Variables Config
        run: |
          mkdir -p .ebextensions
          cat <<EOF > .ebextensions/01_env.config
          option_settings:
            aws:elasticbeanstalk:application:environment:
              DYNAMODB_TABLE_NAME: "SmartShelf_Inventory"
              AWS_STORAGE_BUCKET_NAME: "smartshelf-media-storage"
              AWS_REGION: "us-east-1"
              AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
              AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              AWS_SESSION_TOKEN: "${{ secrets.AWS_SESSION_TOKEN }}"
              DJANGO_SECRET_KEY: "${{ secrets.DJANGO_SECRET_KEY }}"
          EOF

      - name: Generate Deployment Package
        run: zip -r deploy.zip . -x "*.git*" "venv/*" ".env" "*.pyc" "__pycache__/*"

      - name: Upload Package to S3
        run: |
          aws s3 cp deploy.zip s3://smartshelf-media-storage/deployments/deploy-${{ github.sha }}.zip

      - name: Create Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name 'SmartShelf-App' \
            --version-label "web-${{ github.sha }}" \
            --source-bundle S3Bucket=smartshelf-media-storage,S3Key=deployments/deploy-${{ github.sha }}.zip \
            --region us-east-1
          
          echo "Waiting for propagation..."
          sleep 15

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: ${{ secrets.EB_APP_NAME }}
          environment_name: ${{ secrets.EB_ENV_NAME }}
          region: 'us-east-1'
          version_label: "web-${{ github.sha }}"
          wait_for_environment_recovery: 300