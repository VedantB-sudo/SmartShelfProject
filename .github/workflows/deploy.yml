name: SmartShelf CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5  # Updated to v5
        with:
          python-version: '3.9'
          cache: 'pip'  # Speeds up subsequent builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip Deployment Package
        # CRITICAL FIX: The "." ensures .ebextensions is included. 
        # We also exclude the zip itself to keep the package small.
        run: zip -r deploy.zip . -x "*.git*" "venv/*" "__pycache__/*"

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APP_NAME }} # Or your actual app name
          environment_name: ${{ secrets.EB_ENV_NAME }} # Or your actual env name
          version_label: "v-${{ github.sha }}"
          region: us-east-1
          deployment_package: deploy.zip
          # ADD THIS LINE BELOW
          existing_bucket_name: "smartshelf-media-storage"