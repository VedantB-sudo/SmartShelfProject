name: SmartShelf CI/CD - Deploy to AWS

on:
  push:
    branches:
      - main  # Trigger only when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Deployment Package
        run: zip -r deploy.zip . -x "*.git*" "venv/*" "__pycache__/*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }} # CRITICAL for NCI Learner Lab
          application_name: ${{ secrets.EB_APP_NAME }}
          environment_name: ${{ secrets.EB_ENV_NAME }}
          version_label: "v-${{ github.sha }}"
          region: us-east-1
          deployment_package: deploy.zip
          existing_bucket_name: "smartshelf-media-storage"